[build]
command = "python scripts/build_site.py"
publish = "dist"

# Original certificates contain personal IDs. Only curated public copies are served.
[[redirects]]
from = "/admin/Certificates/*"
to = "/404.html"
status = 404
force = true

[[headers]]
for = "/*"

  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Content-Security-Policy = "frame-ancestors 'none';"
  X-Frame-Options = "DENY"

[[headers]]
for = "/content/*"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/assets/images/*"

  [headers.values]
  Cache-Control = "public, max-age=86400"
